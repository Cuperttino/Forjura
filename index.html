<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Registra pesos, series y descansos en el gimnasio y sigue tu evolución.">
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hierro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Hierro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700&display=swap">
<style>
/* Layout: one-handed phone column. The rubber floor is the ground, weights are shown as large stamped numerals,
   and the competition plate colours (5 white, 10 green, 15 yellow, 20 blue, 25 red) code the rest times. */
:root {
  color-scheme: dark;
  --ground: #0d0f12;
  --plate: #171a1e;
  --plate-2: #22262c;
  --line: #31363d;
  --chalk: #f2f0ea;
  --steel: #aab0b8;
  --steel-dim: #828991;
  --load: #f5c518;
  --on-load: #14120a;
  --up: #58cf7d;
  --down: #ef7b70;
  --p5: #eceae3;
  --p10: #2fa84f;
  --p15: #f5c518;
  --p20: #2f6fe4;
  --p25: #d9342b;
  --stamp: "Big Shoulders Display", "Big Shoulders", "Barlow Condensed", Impact, "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body { background: var(--ground); color: var(--chalk); font: 500 16px/1.4 var(--body); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--load); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; background: var(--ground); }
@media (min-width: 600px) { #app { border-inline: 1px solid var(--plate-2); } }
#screen { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: none; }
.pad { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stamp { font-family: var(--stamp); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: .98; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--steel); }
.muted { color: var(--steel); }
.dim { color: var(--steel-dim); }
.num { font-variant-numeric: tabular-nums; }
.small { font-size: 14px; }

/* buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 17px; background: var(--plate-2); color: var(--chalk); text-align: center; width: 100%; transition: transform .1s ease, background-color .15s ease; }
.btn:active { transform: scale(.98); }
.btn.go { background: var(--load); color: var(--on-load); font-family: var(--stamp); font-weight: 900; font-size: 25px; letter-spacing: .03em; text-transform: uppercase; min-height: 66px; }
.btn.line { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { color: var(--down); background: transparent; box-shadow: inset 0 0 0 1.5px #5b2f2c; }
.btn.fire { background: var(--p25); color: #fff; }
.btn[disabled] { opacity: .45; }
.btn.slim { min-height: 48px; font-size: 16px; }
.link { color: var(--load); font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; text-align: left; }
.iconbtn { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 8px; color: var(--chalk); flex: none; }
.iconbtn:active { background: var(--plate-2); }
.iconbtn svg, .nav svg, .btn svg { width: 24px; height: 24px; flex: none; }
.chip { min-height: 44px; padding: 8px 14px; border-radius: 22px; background: var(--plate-2); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--load); color: var(--on-load); }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; }
.addbtn { flex: none; min-height: 54px; padding: 0 18px; border-radius: 8px; background: var(--load); color: var(--on-load); font-weight: 700; }
.chip svg, .exrow svg { width: 18px; height: 18px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

/* fields */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; color: var(--steel); }
input[type=text], input[type=email], input[type=password], input[type=number], textarea, select { width: 100%; min-height: 54px; padding: 12px 14px; font-size: 17px; background: var(--plate); border: 1.5px solid var(--line); border-radius: 8px; }
input:focus, textarea:focus, select:focus { border-color: var(--load); outline: none; }
textarea { min-height: 76px; resize: vertical; line-height: 1.35; }
.err { color: var(--down); font-weight: 600; font-size: 15px; }

/* top bar */
.bar { position: sticky; top: 0; z-index: 5; background: var(--ground); display: flex; align-items: center; gap: 4px; min-height: 60px; padding: 6px var(--gutter-r) 6px max(8px, env(safe-area-inset-left, 0px)); }
.bar .ttl { flex: 1; min-width: 0; font-size: 26px; overflow-wrap: anywhere; }
.page-title { font-size: 40px; padding-top: 22px; padding-bottom: 14px; }

/* bottom nav */
.nav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--plate); border-top: 1px solid var(--plate-2); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); flex: none; }
.nav button { min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--steel-dim); }
.nav button.on { color: var(--load); }
.nav .brand { display: none; }
.nav .credit { display: none; }
.credit { margin: 0; text-align: center; font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--steel-dim); }
.nav.focus { display: none; }

/* rest bar */
.restbar { flex: none; display: flex; align-items: center; gap: 12px; min-height: 58px; padding-left: var(--gutter-l); padding-right: max(6px, env(safe-area-inset-right, 0px)); background: var(--plate-2); border-top: 2px solid var(--rest, var(--load)); width: 100%; text-align: left; cursor: pointer; }
.restbar .t { font-family: var(--stamp); font-weight: 800; font-size: 32px; font-variant-numeric: tabular-nums; min-width: 72px; }
.restbar .l { flex: 1; font-size: 14px; color: var(--steel); font-weight: 600; }

/* auth */
.auth-hero { position: relative; height: 26vh; min-height: 160px; max-height: 330px; overflow: hidden; background: var(--plate); }
.auth-hero img, .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.auth-hero::after, .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--ground) 2%, rgba(13,15,18,.62) 40%, rgba(13,15,18,0) 74%); pointer-events: none; }
.wordmark { position: absolute; left: var(--gutter-l); bottom: 8px; z-index: 1; font-size: clamp(66px, 21vw, 104px); font-weight: 900; line-height: .86; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--plate); border-radius: 8px; padding: 4px; gap: 4px; }
.seg button { min-height: 46px; border-radius: 6px; font-weight: 700; color: var(--steel); font-size: 15px; padding: 4px; }
.seg button.on { background: var(--plate-2); color: var(--chalk); box-shadow: inset 0 -2px 0 var(--load); }

/* setup */
.steps { display: flex; gap: 5px; padding-top: 18px; }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--plate-2); }
.steps i.on { background: var(--load); }
.q { font-size: clamp(38px, 11vw, 52px); padding-top: 18px; }
.grid7 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.bigpick { aspect-ratio: 1; max-height: 112px; width: 100%; border-radius: 8px; background: var(--plate); box-shadow: inset 0 0 0 1.5px var(--line); font-family: var(--stamp); font-weight: 800; font-size: 42px; }
.bigpick.on { background: var(--load); color: var(--on-load); box-shadow: none; }
.dayrow { display: flex; align-items: center; justify-content: space-between; min-height: 60px; width: 100%; padding: 8px 16px; background: var(--plate); border-radius: 8px; font-weight: 600; font-size: 18px; text-align: left; box-shadow: inset 0 0 0 1.5px transparent; }
.dayrow.on { box-shadow: inset 0 0 0 2px var(--load); }
.tick { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; flex: none; }
.dayrow.on .tick { background: var(--load); box-shadow: none; color: var(--on-load); }
.tick svg { width: 18px; height: 18px; }
.tpl { display: block; width: 100%; padding: 14px 16px; background: var(--plate); border-radius: 8px; text-align: left; box-shadow: inset 0 0 0 1.5px transparent; }
.tpl.on { box-shadow: inset 0 0 0 2px var(--load); }
.tpl b { display: block; font-size: 18px; font-weight: 700; }
.tpl span { display: block; color: var(--steel); font-size: 14.5px; margin-top: 2px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs .chip { flex: none; white-space: nowrap; }
.foot { position: sticky; bottom: 0; background: linear-gradient(to top, var(--ground) 76%, rgba(13,15,18,0)); padding-top: 18px; padding-bottom: 14px; z-index: 4; display: flex; gap: 10px; }
.foot .back { flex: 0 0 72px; width: 72px; }

/* home */
.hero { position: relative; height: clamp(300px, 88vw, 430px); overflow: hidden; background: var(--plate); }
.hero-top { position: absolute; z-index: 1; top: 14px; left: var(--gutter-l); right: var(--gutter-r); font-weight: 600; font-size: 17px; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
.hero-quote { position: absolute; z-index: 1; bottom: 12px; left: var(--gutter-l); right: var(--gutter-r); }
.hero-quote p { font-size: clamp(31px, 9vw, 44px); font-weight: 800; text-wrap: balance; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: var(--steel-dim); padding: 7px 0; border-radius: 6px; }
.wd.today { color: var(--chalk); background: var(--plate-2); }
.wd i { width: 14px; height: 14px; border-radius: 50%; display: block; }
.wd i.plan { box-shadow: inset 0 0 0 2px var(--steel-dim); }
.wd i.done { background: var(--load); }
.wd i.none { background: var(--plate-2); width: 6px; height: 6px; margin: 4px; }
.wod { background: var(--plate); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.wod h2 { font-size: 38px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--steel); font-weight: 600; font-size: 15px; }

/* routine */
.drow { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 8px 12px 14px; min-height: 76px; background: var(--plate); border-radius: 8px; text-align: left; }
.drow .wk { width: 46px; flex: none; font-size: 30px; color: var(--load); text-align: center; }
.drow .wk.off { color: var(--steel-dim); font-size: 22px; }
.drow .tx { flex: 1; min-width: 0; }
.drow b { display: block; font-size: 19px; font-weight: 700; overflow-wrap: anywhere; }
.drow span { display: block; color: var(--steel); font-size: 14.5px; }
.drow > svg { width: 22px; height: 22px; color: var(--steel-dim); flex: none; }
.gcard { background: var(--plate); border-radius: 8px; padding: 6px 6px 8px; }
.ghead { display: flex; align-items: center; gap: 4px; padding-left: 10px; min-height: 48px; }
.ghead h3 { flex: 1; font-size: 25px; }
.exrow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 8px 10px; border-top: 1px solid var(--plate-2); text-align: left; }
.exrow .n { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.exrow .m { color: var(--steel); font-size: 14.5px; white-space: nowrap; }
.wkpick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.wkpick button { min-height: 48px; border-radius: 6px; background: var(--plate); font-weight: 700; color: var(--steel); }
.wkpick button.on { background: var(--load); color: var(--on-load); }

/* workout */
.wstat { display: flex; align-items: baseline; gap: 14px; color: var(--steel); font-weight: 600; }
.wstat b { font-family: var(--stamp); font-size: 32px; color: var(--chalk); font-weight: 800; font-variant-numeric: tabular-nums; }
.meter { height: 6px; background: var(--plate-2); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--load); transition: width .25s ease; }
.work { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 76px; padding: 12px 10px; border-top: 1px solid var(--plate-2); text-align: left; }
.work .tx { flex: 1; min-width: 0; }
.work b { display: block; font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
.work span { display: block; color: var(--steel); font-size: 14.5px; }
.pips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.pips i { width: 16px; height: 6px; border-radius: 3px; background: var(--plate-2); box-shadow: inset 0 0 0 1px var(--line); }
.pips i.on { background: var(--load); box-shadow: none; }
.work.done b { color: var(--steel); }

/* set logger */
.last { background: var(--plate); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.lastsets { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.lastsets span { white-space: nowrap; }
.stepper { background: var(--plate); border-radius: 10px; padding: 10px 10px 8px; }
.stepper + .stepper { margin-top: 10px; }
.stepper .cap { text-align: center; font-size: 13px; font-weight: 700; letter-spacing: .09em; color: var(--steel); text-transform: uppercase; }
.srow { display: flex; align-items: center; gap: 6px; }
.stepbtn { width: 72px; height: 76px; flex: none; border-radius: 8px; background: var(--plate-2); font-family: var(--stamp); font-size: 44px; font-weight: 800; user-select: none; -webkit-user-select: none; touch-action: none; }
.stepbtn:active { background: var(--line); }
.bignum { flex: 1; min-width: 0; width: 100%; text-align: center; background: transparent !important; border: 0 !important; padding: 0 !important; font-family: var(--stamp) !important; font-weight: 900; font-size: 72px !important; line-height: 1; min-height: 78px; font-variant-numeric: tabular-nums; border-radius: 6px; }
.bignum:focus { box-shadow: inset 0 -3px 0 var(--load); }
.setrow { display: flex; align-items: center; gap: 10px; min-height: 56px; border-top: 1px solid var(--plate-2); }
.setrow .idx { width: 28px; flex: none; text-align: center; font-family: var(--stamp); font-weight: 800; font-size: 24px; color: var(--steel-dim); }
.setrow .val { flex: 1; min-width: 0; text-align: left; min-height: 54px; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.delta { font-size: 14px; font-weight: 700; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta.same { color: var(--steel-dim); }
.pr { background: var(--load); color: var(--on-load); font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 4px; letter-spacing: .04em; }
.flash { animation: flash .45s ease; }
@keyframes flash { from { background: rgba(245,197,24,.28); } to { background: transparent; } }
.hist { padding: 12px 0; border-top: 1px solid var(--plate-2); display: flex; flex-direction: column; gap: 3px; }
.hist .d { color: var(--steel); font-weight: 600; font-size: 14.5px; }

/* timer */
.overlay { position: absolute; inset: 0; z-index: 20; background: rgba(5,6,8,.7); display: flex; flex-direction: column; justify-content: flex-end; animation: fade .16s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { background: var(--plate); border-radius: 14px 14px 0 0; max-height: 92%; overflow-y: auto; padding: 16px var(--gutter-r) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); display: flex; flex-direction: column; gap: 14px; animation: rise .3s cubic-bezier(.22,.8,.24,1); }
@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
.sheet input, .sheet textarea, .sheet select { background: var(--ground); }
.sheet .chip { background: var(--plate-2); }
.sheet .chip.on { background: var(--load); }
.sheet .dayrow { background: var(--plate-2); }
.sheet h2 { font-size: 30px; }
.shead { display: flex; align-items: center; gap: 8px; }
.shead h2 { flex: 1; min-width: 0; }
.mins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.minbtn { aspect-ratio: 1; width: 100%; max-width: 72px; margin: 0 auto; border-radius: 50%; background: var(--ground); box-shadow: inset 0 0 0 5px var(--c); font-family: var(--stamp); font-weight: 800; font-size: 28px; display: grid; place-items: center; }
.minbtn.on { background: var(--c); color: var(--t); }
.dial { position: relative; width: min(72vw, 300px, 40vh); aspect-ratio: 1; margin: 0 auto; }
.dial svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
.dial .read { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.dial .read b { font-family: var(--stamp); font-weight: 900; font-size: min(21vw, 88px, 12vh); font-variant-numeric: tabular-nums; line-height: 1; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.adj { display: flex; gap: 8px; justify-content: center; }
.adj .chip { min-width: 84px; justify-content: center; }
.done-flash { position: absolute; inset: 0; z-index: 30; background: var(--load); color: var(--on-load); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; animation: pulse 1s ease-in-out 3; width: 100%; }
.done-flash b { font-family: var(--stamp); font-weight: 900; font-size: clamp(60px, 18vw, 96px); line-height: .92; text-transform: uppercase; }
@keyframes pulse { 0%,100% { background: var(--load); } 50% { background: #fff1b0; } }

/* progress */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--plate-2); border-radius: 8px; overflow: hidden; }
.stats div { background: var(--plate); padding: 10px 12px; min-width: 0; }
.stats b { display: block; font-family: var(--stamp); font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.05; }
.stats span { font-size: 13px; color: var(--steel); font-weight: 600; }
.chart { position: relative; background: var(--plate); border-radius: 8px; padding: 12px 8px 6px; }
.chart svg { width: 100%; display: block; touch-action: pan-y; overflow: visible; }
.chart text { fill: var(--steel-dim); font: 600 12px var(--body); font-variant-numeric: tabular-nums; }
.tip { position: absolute; top: 8px; transform: translateX(-50%); background: var(--ground); box-shadow: 0 0 0 1px var(--line); border-radius: 6px; padding: 5px 9px; font-size: 13.5px; font-weight: 600; white-space: nowrap; pointer-events: none; }
.tip b { font-size: 16px; }
.empty { padding: 26px 16px; text-align: center; color: var(--steel); background: var(--plate); border-radius: 8px; }
details.sess { border-top: 1px solid var(--plate-2); }
details.sess summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; min-height: 62px; padding: 8px 0; }
details.sess summary::-webkit-details-marker { display: none; }
details.sess summary b { display: block; font-size: 17px; font-weight: 700; }
details.sess summary span { font-size: 14px; color: var(--steel); }

/* settings */
.setline { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; padding: 6px 0; border-top: 1px solid var(--plate-2); width: 100%; text-align: left; }
.switch { width: 54px; height: 32px; border-radius: 16px; background: var(--line); position: relative; flex: none; transition: background-color .15s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--chalk); transition: transform .15s; }
.switch.on { background: var(--load); }
.switch.on i { transform: translateX(22px); background: var(--on-load); }
.sect { padding-top: 22px; padding-bottom: 4px; }

function wireChart() {

  const show = ev => {
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * CH.W;
    let best = pts[0]; for (const p of pts) if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p;
    $('#ch-cross').setAttribute('x1', best.x); $('#ch-cross').setAttribute('x2', best.x); $('#ch-cross').setAttribute('visibility', 'visible');
    const dot = $('#ch-dot'); dot.setAttribute('cx', best.x); dot.setAttribute('cy', best.y); dot.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.innerHTML = `<b>${num(best.v)} ${u}</b> · ${fmtDate(best.t)}`;
    const px = best.x / CH.W * r.width + (r.left - wrap.getBoundingClientRect().left);

function loadDemo() {

  const mk = (id, name, wd, groups) => ({ id, name, weekday: wd, groups });
  const t = weekdayOf(new Date());
  const wdA = [t, (t + 2) % 7, (t + 4) % 7];
  const ds = [
    mk('dA', 'Empuje', wdA[0], [
      { id: 'g1', muscle: 'Pecho', exercises: [blue('e1', 'Press banca', 4, '6-8'), blue('e2', 'Press inclinado con mancuernas', 3, '8-10')] },
      { id: 'g2', muscle: 'Hombros', exercises: [blue('e3', 'Press militar', 3, '8-10'), blue('e4', 'Elevaciones laterales', 3, '12-15')] },
      { id: 'g3', muscle: 'Tríceps', exercises: [blue('e5', 'Extensión en polea', 3, '10-12')] }]),
    mk('dB', 'Tirón', wdA[1], [
      { id: 'g4', muscle: 'Espalda', exercises: [blue('e6', 'Jalón al pecho', 4, '8-10'), blue('e7', 'Remo en polea baja', 3, '8-10')] },
      { id: 'g5', muscle: 'Bíceps', exercises: [blue('e8', 'Curl con barra', 3, '8-12')] }]),
    mk('dC', 'Pierna', wdA[2], [
      { id: 'g6', muscle: 'Piernas', exercises: [blue('e9', 'Sentadilla', 4, '5-8'), blue('e10', 'Prensa', 3, '10-12'), blue('e11', 'Curl femoral', 3, '10-12')] }])
  ];
  const base = { e1: [60, 8], e2: [20, 10], e3: [35, 8], e4: [8, 12], e5: [25, 12], e6: [50, 10], e7: [45, 10], e8: [25, 10], e9: [70, 8], e10: [120, 12], e11: [35, 12] };
  const gain = { e1: 1.25, e2: .5, e3: .6, e4: .15, e5: .6, e6: 1, e7: 1, e8: .35, e9: 1.5, e10: 2.5, e11: .75 };
  const sessions = []; const now = Date.now();
  let n = 0;
  for (let back = 54; back >= 1; back -= 2) {
    if (back % 7 === 5) continue;
    const date = new Date(now - back * 864e5); date.setHours(18, 15, 0, 0);
    const d = ds[n % 3]; n++;
    const sets = []; let at = date.getTime();
    d.groups.forEach(g => g.exercises.forEach(e => {
      const prog = (54 - back) / 7, w = Math.round((base[e.id][0] + gain[e.id] * prog) / 1.25) * 1.25;
      for (let i = 0; i < e.sets; i++) { at += 170000; sets.push({ ex: e.id, name: e.name, group: g.muscle, w: i === e.sets - 1 ? Math.max(0, w - 1.25) : w, r: base[e.id][1] - (i > 1 ? 1 : 0), at }); }
    }));
    sessions.push({ id: 's' + back, dayId: d.id, dayName: d.name, start: date.getTime(), end: at + 90000, sets, notes: {}, updatedAt: at });
  }
  const lastS = sessions[sessions.length - 1]; if (lastS.dayId === 'dA') lastS.notes.e1 = 'Agarre medio. La última serie costó.';
  const data = defaultData('Alex');
  data.days = ds; data.setupDone = true;
  const blog = []; for (let k = 8; k >= 0; k--) blog.push({ t: now - k * 7 * 864e5, kg: Math.round((78.6 - (8 - k) * .32 + (k % 3 === 0 ? .3 : 0)) * 10) / 10 });
  data.body = { height: 178, goal: 75, goalFrom: blog[0].kg, asked: true, log: blog };
  S.bodyDraft = null;
  S.demo = true; S.data = data; S.sessions = sessions;
  S.prog.ex = 'e1';
}

/* ========== event wiring ========== */
const VIEWS = {
  loading: () => '<div class="pad" style="padding-top:40vh;text-align:center"><span class="stamp" style="font-size:44px">Hierro</span></div>',
  setup: setupView, home: homeView, routine: routineView, day: dayView,
  workout: workoutView, log: logView, summary: summaryView, progress: progressView, body: bodyView, settings: settingsView
};
ACTS['tab'] = d => go(d.v);
const app = $('#app');
app.addEventListener('click', ev => {
  const backdrop = ev.target.dataset && ev.target.dataset.backdrop;
  if (backdrop) { S.sheet = null; renderSheet(); renderRest(); return; }
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = ACTS[el.dataset.a];
  if (fn) { ev.preventDefault(); fn(el.dataset, el); }
});
app.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('restbar')) { ev.preventDefault(); ACTS['open-timer'](); }
  if ((ev.target.id === 'd-w' || ev.target.id === 'd-r') && S.draft) {
    if (ev.key === 'Enter') { ev.preventDefault(); ACTS['save-set'](); $('#save-set') && $('#save-set').focus(); return; }
    if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
      ev.preventDefault();
      const dir = ev.key === 'ArrowUp' ? 1 : -1, d = S.draft;
      if (ev.target.id === 'd-w') { d.w = Math.max(0, Math.round((d.w + dir * S.data.settings.step) * 100) / 100); ev.target.value = num(d.w); }
      else { d.r = Math.max(0, d.r + dir); ev.target.value = d.r; }
      return;
    }
  }
  if (ev.key === 'Escape' && S.sheet) { S.sheet = null; renderSheet(); renderRest(); }
});
app.addEventListener('change', ev => { const el = ev.target; const fn = el.dataset && INPUTS[el.dataset.i]; if (fn && el.dataset.i !== 'b-w' && el.dataset.i !== 'd-w' && el.dataset.i !== 'd-r' && el.dataset.i !== 'd-note') fn(el.dataset, el); });
app.addEventListener('input', ev => { const el = ev.target; const k = el.dataset && el.dataset.i; if (k === 'b-w') S.bodyDraft = Math.max(0, parseNum(el.value)); if (k === 'd-w' || k === 'd-r') INPUTS[k](el.dataset, el); if (k === 'd-note') { clearTimeout(noteT); noteT = setTimeout(() => INPUTS['d-note'](el.dataset, el), 500); } });
app.addEventListener('focusin', ev => { if (ev.target.classList && ev.target.classList.contains('bignum')) ev.target.select(); });
app.addEventListener('focusout', ev => { if (ev.target.id === 'd-w' && S.draft) ev.target.value = num(S.draft.w); if (ev.target.id === 'd-r' && S.draft) ev.target.value = S.draft.r; if (ev.target.id === 'b-w') ev.target.value = num(S.bodyDraft, 1); });
app.addEventListener('submit', ev => {
  ev.preventDefault();
  const id = ev.target.id;
  if (id === 'start-form') {
    const v = $('#f-name').value.trim();
    if (!v) { $('#name-err').hidden = false; $('#f-name').focus(); return; }
    if (S.data) S.data.account.name = v; else S.data = defaultData(v);
    touch(); S.setup.step = 2; render(true);
  }
  if (id === 'group-form') { const v = $('#g-custom').value.trim(); if (v) addGroup(v); }
  if (id === 'ex-form') { const i = $('#e-custom'), v = i.value.trim(); if (v) addEx(v); const n = $('#e-custom'); if (n) n.focus(); }
  if (id === 'exedit-form') {
    const s = S.sheet, day = findDay(s.day), g = day.groups.find(x => x.id === s.g), e = g.exercises.find(x => x.id === s.e);
    e.name = $('#ee-name').value.trim() || e.name; e.sets = Math.max(1, Math.min(20, parseInt($('#ee-sets').value, 10) || 3)); e.reps = $('#ee-reps').value.trim() || e.reps;
    touch(); S.sheet = null; render();
  }
  const bodyErr = (p, msg) => { const e = $('#' + p + '-err'); if (e) { e.textContent = msg; e.hidden = false; } };
  if (id === 'body-setup') { const m = saveBodyFields('s'); if (m) return bodyErr('s', m); S.data.setupDone = true; touch(); S.setup = null; go('home'); }
  if (id === 'body-first') { const m = saveBodyFields('f'); if (m) return bodyErr('f', m); S.bodyDraft = null; render(); }
  if (id === 'body-ask') { const m = saveBodyFields('a'); if (m) return bodyErr('a', m); S.bodyDraft = null; S.sheet = null; render(); toast('Guardado. Lo tienes en Cuerpo'); }
  if (id === 'goal-form') {
    const v = fromDisp(parseNum($('#g-goal').value));
    if (!validKg(v)) return bodyErr('g', 'Escribe un peso objetivo realista.');
    const b = bodyOf(), l = b.log[b.log.length - 1];
    b.goal = Math.round(v * 100) / 100; b.goalFrom = l ? l.kg : null; touch(); S.sheet = null; render();
  }
  if (id === 'height-form') {
    const v = parseNum($('#h-cm').value);
    if (!validCm(v)) return bodyErr('h', 'Escribe la altura en centímetros, por ejemplo 175.');
    bodyOf().height = Math.round(v); touch(); S.sheet = null; render();
  }
  if (id === 'name-form') { const v = $('#n-name').value.trim(); if (v) { S.data.account.name = v; touch(); } S.sheet = null; render(); }
});
/* hold-to-repeat steppers */
let holdT = null, holdI = null;
const stopHold = () => { clearTimeout(holdT); clearInterval(holdI); holdT = holdI = null; };
app.addEventListener('pointerdown', ev => {
  const b = ev.target.closest('[data-step]');
  if (!b) return;
  ev.preventDefault(); unlockAudio();
  stepDraft(b.dataset.step, +b.dataset.dir);
  holdT = setTimeout(() => { holdI = setInterval(() => stepDraft(b.dataset.step, +b.dataset.dir), 110); }, 420);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => app.addEventListener(t, stopHold, true));
app.addEventListener('click', ev => { const b = ev.target.closest('[data-step]'); if (b && ev.detail === 0) stepDraft(b.dataset.step, +b.dataset.dir); });
document.addEventListener('pointerdown', unlockAudio, { once: true });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { persist(); return; }
  if (T.running) holdScreen(true);
});
window.addEventListener('pagehide', persist);

/* Keep sheets above the on-screen keyboard */
function fitKeyboard() {
  const v = window.visualViewport; if (!v) return;
  app.style.height = v.height < window.innerHeight - 80 ? v.height + 'px' : '';
  if (window.scrollY) window.scrollTo(0, 0);
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitKeyboard); visualViewport.addEventListener('scroll', fitKeyboard); }

/* Pull down to reload: the top image stretches instead of being cut */
const PULL_AT = 70;
let pull = null;
const ptr = document.createElement('div'); ptr.className = 'ptr'; ptr.hidden = true; app.appendChild(ptr);
function pullReset(animated) {
  const sc = screenEl(), hero = $('.hero, .auth-hero', sc);
  if (hero) { hero.style.transition = animated ? 'height .2s ease' : ''; hero.style.height = ''; }
  sc.style.transition = animated ? 'transform .2s ease' : ''; sc.style.transform = '';
  ptr.hidden = true;
}
screenEl().addEventListener('touchstart', ev => {
  pull = null;
  if (S.sheet || screenEl().scrollTop > 0 || ev.touches.length !== 1) return;
  if (ev.target.closest('[data-step], #chart-svg, input, textarea, select')) return;
  const hero = $('.hero, .auth-hero', screenEl());
  pull = { y: ev.touches[0].clientY, d: 0, hero, h: hero ? hero.offsetHeight : 0 };
  if (hero) hero.style.transition = '';
  screenEl().style.transition = '';
}, { passive: true });
screenEl().addEventListener('touchmove', ev => {
  if (!pull) return;
  const dy = ev.touches[0].clientY - pull.y;
  if (dy <= 0 || screenEl().scrollTop > 0) { pull.d = 0; pullReset(false); if (screenEl().scrollTop > 0) pull = null; return; }
  if (dy < 26) { if (pull.d) { pull.d = 0; pullReset(false); } return; }
  pull.d = Math.min(130, (dy - 26) * .5);
  if (pull.hero) pull.hero.style.height = pull.h + pull.d + 'px';
  else screenEl().style.transform = 'translateY(' + pull.d + 'px)';
  if (pull.d > 12) { ptr.hidden = false; ptr.textContent = pull.d >= PULL_AT ? 'Suelta para recargar' : 'Tira para recargar'; }
}, { passive: true });
const endPull = () => {
  if (!pull) return;
  const d = pull.d; pull = null;
  if (d >= PULL_AT) { persist(); ptr.textContent = 'Recargando…'; location.reload(); return; }
  pullReset(true);
};
screenEl().addEventListener('touchend', endPull);
screenEl().addEventListener('touchcancel', endPull);

window.matchMedia(WIDE).addEventListener('change', () => render());
window.addEventListener('resize', moveInd);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);

/* ========== boot ========== */
dailyImage.src = IMAGES[dayOfYear() % IMAGES.length][0];
if (dailyImage.decode) dailyImage.decode().catch(() => {});
restoreTimer();
openApp();
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
