<style>
/* FORJURA design system. Layout: one-handed phone column, sidebar on desktop.
   Electric green is an accent only: main action, active state, progress and charts. Content stays neutral. */
:root {
  color-scheme: dark;
  --ground: #0d0f12;
  --plate: #171a1e;
  --plate-2: #22262c;
  --line: #31363d;
  --chalk: #f2f0ea;
  --steel: #aab0b8;
  --steel-dim: #828991;
  --accent: #c8ff00;
  --on-accent: #10140a;
  --accent-soft: rgba(200,255,0,.16);
  --accent-ink: #5c7500;
  --amber: #f5c518;
  --state-active: var(--accent);
  --state-ok: #58cf7d;
  --state-bad: #ef7b70;
  --logo-symbol: var(--accent);
  --logo-word: var(--chalk);
  --logo-h-sidebar: 34px;
  --logo-h-header: 30px;
  --logo-h-desktop: 84px;
  --logo-h-compact: 92px;
  --logo-h-loading: 112px;
  --logo-icon-sm: 34px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 40px;
  --radius-s: 6px; --radius-m: 8px; --radius-l: 10px; --radius-xl: 14px;
  --text-s: 14px; --text-m: 16px; --text-l: 19px;
  --up: #58cf7d;
  --down: #ef7b70;
  --p5: #eceae3;
  --p10: #2fa84f;
  --p15: #f5c518;
  --p20: #2f6fe4;
  --p25: #d9342b;
  --stamp: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body { background: var(--ground); color: var(--chalk); font: 500 16px/1.4 var(--body); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; background: var(--ground); }
@media (min-width: 600px) { #app { border-inline: 1px solid var(--plate-2); } }
#screen { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: none; }
.pad { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stamp { font-family: var(--stamp); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: .98; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--steel); }
.muted { color: var(--steel); }
.dim { color: var(--steel-dim); }
.num { font-variant-numeric: tabular-nums; }
.small { font-size: 14px; }

/* buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 17px; background: var(--plate-2); color: var(--chalk); text-align: center; width: 100%; transition: transform .1s ease, background-color .15s ease; }
.btn:active { transform: scale(.98); }
.btn.go { background: var(--accent); color: var(--on-accent); font-family: var(--stamp); font-weight: 900; font-size: 25px; letter-spacing: .03em; text-transform: uppercase; min-height: 66px; }
.btn.line { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { color: var(--down); background: transparent; box-shadow: inset 0 0 0 1.5px #5b2f2c; }
.btn.fire { background: var(--p25); color: #fff; }
.btn[disabled] { opacity: .45; }
.btn.slim { min-height: 48px; font-size: 16px; }
.link { color: var(--accent); font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; text-align: left; }
.iconbtn { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 8px; color: var(--chalk); flex: none; }
.iconbtn:active { background: var(--plate-2); }
.iconbtn svg, .nav svg, .btn svg { width: 24px; height: 24px; flex: none; }
.chip { min-height: 44px; padding: 8px 14px; border-radius: 22px; background: var(--plate-2); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--accent); color: var(--on-accent); }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; }
.addbtn { flex: none; min-height: 54px; padding: 0 18px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
.chip svg, .exrow svg { width: 18px; height: 18px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

/* fields */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; color: var(--steel); }
input[type=text], input[type=email], input[type=password], input[type=number], textarea, select { width: 100%; min-height: 54px; padding: 12px 14px; font-size: 17px; background: var(--plate); border: 1.5px solid var(--line); border-radius: 8px; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; }
textarea { min-height: 76px; resize: vertical; line-height: 1.35; }
.err { color: var(--down); font-weight: 600; font-size: 15px; }

/* top bar */
.bar { position: sticky; top: 0; z-index: 5; background: var(--ground); display: flex; align-items: center; gap: 4px; min-height: 60px; padding: 6px var(--gutter-r) 6px max(8px, env(safe-area-inset-left, 0px)); }
.bar .ttl { flex: 1; min-width: 0; font-size: 26px; overflow-wrap: anywhere; }
.page-title { font-size: 40px; padding-top: 22px; padding-bottom: 14px; }

/* bottom nav */
.nav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--plate); border-top: 1px solid var(--plate-2); padding-bottom: max(4px, calc(env(safe-area-inset-bottom, 0px) - 12px)); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); flex: none; }
.nav button { min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--steel-dim); }
.nav button.on { color: var(--accent); }
.nav .brand { display: none; }
.nav .credit { display: none; }
.credit { margin: 0; text-align: center; font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--steel-dim); }
.nav.focus { display: none; }

/* rest bar */
.restbar { flex: none; display: flex; align-items: center; gap: 12px; min-height: 58px; padding-left: var(--gutter-l); padding-right: max(6px, env(safe-area-inset-right, 0px)); background: var(--plate-2); border-top: 2px solid var(--rest, var(--accent)); width: 100%; text-align: left; cursor: pointer; }
.restbar .t { font-family: var(--stamp); font-weight: 800; font-size: 32px; font-variant-numeric: tabular-nums; min-width: 72px; }
.restbar .l { flex: 1; font-size: 14px; color: var(--steel); font-weight: 600; }

/* auth */
.auth-hero { position: relative; height: 17vh; min-height: 110px; max-height: 330px; overflow: hidden; background: var(--plate); }
.auth-hero img, .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero::before { content: ""; position: absolute; inset: 0 0 auto; height: 96px; z-index: 1; background: linear-gradient(to bottom, rgba(13,15,18,.78), rgba(13,15,18,0)); pointer-events: none; }
.auth-hero::after, .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--ground) 2%, rgba(13,15,18,.62) 40%, rgba(13,15,18,0) 74%); pointer-events: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--plate); border-radius: 8px; padding: 4px; gap: 4px; }
.seg button { min-height: 46px; border-radius: 6px; font-weight: 700; color: var(--steel); font-size: 15px; padding: 4px; }
.seg button.on { background: var(--plate-2); color: var(--chalk); box-shadow: inset 0 -2px 0 var(--accent); }

/* setup */
.steps { display: flex; gap: 5px; padding-top: 18px; }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--plate-2); }
.steps i.on { background: var(--accent); }
.q { font-size: clamp(38px, 11vw, 52px); padding-top: 18px; }
.grid7 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.bigpick { aspect-ratio: 1; max-height: 112px; width: 100%; border-radius: 8px; background: var(--plate); box-shadow: inset 0 0 0 1.5px var(--line); font-family: var(--stamp); font-weight: 800; font-size: 42px; }
.bigpick.on { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.dayrow { display: flex; align-items: center; justify-content: space-between; min-height: 60px; width: 100%; padding: 8px 16px; background: var(--plate); border-radius: 8px; font-weight: 600; font-size: 18px; text-align: left; box-shadow: inset 0 0 0 1.5px transparent; }
.dayrow.on { box-shadow: inset 0 0 0 2px var(--accent); }
.tick { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; flex: none; }
.dayrow.on .tick { background: var(--accent); box-shadow: none; color: var(--on-accent); }
.tick svg { width: 18px; height: 18px; }
.tpl { display: block; width: 100%; padding: 14px 16px; background: var(--plate); border-radius: 8px; text-align: left; box-shadow: inset 0 0 0 1.5px transparent; }
.tpl.on { box-shadow: inset 0 0 0 2px var(--accent); }
.tpl b { display: block; font-size: 18px; font-weight: 700; }
.tpl span { display: block; color: var(--steel); font-size: 14.5px; margin-top: 2px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs .chip { flex: none; white-space: nowrap; }
.foot { position: sticky; bottom: 0; background: linear-gradient(to top, var(--ground) 76%, rgba(13,15,18,0)); padding-top: 18px; padding-bottom: 14px; z-index: 4; display: flex; gap: 10px; }
.foot .back { flex: 0 0 72px; width: 72px; }

/* home */
.hero { position: relative; height: clamp(300px, 88vw, 430px); overflow: hidden; background: var(--plate); }
.hero-top { position: absolute; z-index: 2; top: 14px; left: var(--gutter-l); right: var(--gutter-r); font-weight: 600; font-size: 17px; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
.hero-quote { position: absolute; z-index: 1; bottom: 12px; left: var(--gutter-l); right: var(--gutter-r); }
.hero-quote p { font-size: clamp(31px, 9vw, 44px); font-weight: 800; text-wrap: balance; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: var(--steel-dim); padding: 7px 0; border-radius: 6px; }
.wd.today { color: var(--chalk); background: var(--plate-2); }
.wd i { width: 14px; height: 14px; border-radius: 50%; display: block; }
.wd i.plan { box-shadow: inset 0 0 0 2px var(--steel-dim); }
.wd i.done { background: var(--accent); }
.wd i.none { background: var(--plate-2); width: 6px; height: 6px; margin: 4px; }
.wod { background: var(--plate); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.wod h2 { font-size: 38px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--steel); font-weight: 600; font-size: 15px; }

/* routine */
.drow { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 8px 12px 14px; min-height: 76px; background: var(--plate); border-radius: 8px; text-align: left; }
.drow .wk { width: 46px; flex: none; font-size: 30px; color: var(--chalk); text-align: center; }
.drow .wk.off { color: var(--steel-dim); font-size: 22px; }
.drow .tx { flex: 1; min-width: 0; }
.drow b { display: block; font-size: 19px; font-weight: 700; overflow-wrap: anywhere; }
.drow span { display: block; color: var(--steel); font-size: 14.5px; }
.drow > svg { width: 22px; height: 22px; color: var(--steel-dim); flex: none; }
.gcard { background: var(--plate); border-radius: 8px; padding: 6px 6px 8px; }
.ghead { display: flex; align-items: center; gap: 4px; padding-left: 10px; min-height: 48px; }
.ghead h3 { flex: 1; font-size: 25px; }
.exrow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 8px 10px; border-top: 1px solid var(--plate-2); text-align: left; }
.exrow .n { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.exrow .m { color: var(--steel); font-size: 14.5px; white-space: nowrap; }
.exitem { position: relative; overflow: hidden; border-top: 1px solid var(--plate-2); }
.exitem .exrow { border-top: 0; flex: 1; min-width: 0; }
.exfront { position: relative; display: flex; align-items: stretch; background: var(--plate); touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.exdel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-right: 18px; background: #5b2320; color: #fff; font-weight: 700; font-size: 15px; visibility: hidden; transition: background-color .14s; }
.exdel svg { width: 20px; height: 20px; flex: none; transition: transform .14s; }
.exitem.swiping .exdel { visibility: visible; }
.exitem.armed .exdel { background: var(--p25); }
.exitem.armed .exdel svg { transform: scale(1.25); }
.grip { flex: none; width: 52px; min-height: 54px; display: grid; place-items: center; color: var(--steel-dim); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.grip svg { width: 22px; height: 22px; }
.grip:active { color: var(--accent); cursor: grabbing; }
.exitem.shifting { transition: transform .18s cubic-bezier(.22,.8,.24,1); }
.exitem.dragging { z-index: 5; overflow: visible; border-radius: 6px; box-shadow: 0 10px 28px rgba(0,0,0,.65); }
.exitem.dragging .exfront { background: var(--plate-2); border-radius: 6px; }
.exitem.dragging .grip { color: var(--accent); }
.exitem.settling { transition: transform .16s cubic-bezier(.22,.8,.24,1); }
.toast.undo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 8px 6px 16px; pointer-events: auto; text-align: left; }
.toast.undo span { min-width: 0; overflow-wrap: anywhere; }
.toast.undo button { flex: none; min-height: 44px; padding: 0 12px; border-radius: 6px; font-weight: 700; color: #4d6200; }
.wkpick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.wkpick button { min-height: 48px; border-radius: 6px; background: var(--plate); font-weight: 700; color: var(--steel); }
.wkpick button.on { background: var(--accent); color: var(--on-accent); }

/* workout */
.wstat { display: flex; align-items: baseline; gap: 14px; color: var(--steel); font-weight: 600; }
.wstat b { font-family: var(--stamp); font-size: 32px; color: var(--chalk); font-weight: 800; font-variant-numeric: tabular-nums; }
.meter { height: 6px; background: var(--plate-2); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.work { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 76px; padding: 12px 10px; border-top: 1px solid var(--plate-2); text-align: left; }
.work .tx { flex: 1; min-width: 0; }
.work b { display: block; font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
.work span { display: block; color: var(--steel); font-size: 14.5px; }
.pips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.pips i { width: 16px; height: 6px; border-radius: 3px; background: var(--plate-2); box-shadow: inset 0 0 0 1px var(--line); }
.pips i.on { background: var(--accent); box-shadow: none; }
.work.done b { color: var(--steel); }

/* set logger */
.last { background: var(--plate); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.lastsets { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.lastsets span { white-space: nowrap; }
.stepper { background: var(--plate); border-radius: 10px; padding: 10px 10px 8px; }
.stepper + .stepper { margin-top: 10px; }
.stepper .cap { text-align: center; font-size: 13px; font-weight: 700; letter-spacing: .09em; color: var(--steel); text-transform: uppercase; }
.srow { display: flex; align-items: center; gap: 6px; }
.stepbtn { width: 72px; height: 76px; flex: none; border-radius: 8px; background: var(--plate-2); font-family: var(--stamp); font-size: 44px; font-weight: 800; user-select: none; -webkit-user-select: none; touch-action: none; }
.stepbtn:active { background: var(--line); }
.bignum { flex: 1; min-width: 0; width: 100%; text-align: center; background: transparent !important; border: 0 !important; padding: 0 !important; font-family: var(--stamp) !important; font-weight: 900; font-size: clamp(50px, 14.5vw, 72px) !important; line-height: 1; min-height: 78px; font-variant-numeric: tabular-nums; border-radius: 6px; }
.bignum:focus { box-shadow: inset 0 -3px 0 var(--accent); }
.setrow { display: flex; align-items: center; gap: 10px; min-height: 56px; border-top: 1px solid var(--plate-2); }
.setrow .idx { width: 28px; flex: none; text-align: center; font-family: var(--stamp); font-weight: 800; font-size: 24px; color: var(--steel-dim); }
.setrow .val { flex: 1; min-width: 0; text-align: left; min-height: 54px; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.delta { font-size: 14px; font-weight: 700; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta.same { color: var(--steel-dim); }
.pr { background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 4px; letter-spacing: .04em; }
.flash { animation: flash .45s ease; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.hist { padding: 12px 0; border-top: 1px solid var(--plate-2); display: flex; flex-direction: column; gap: 3px; }
.hist .d { color: var(--steel); font-weight: 600; font-size: 14.5px; }

/* timer */
.overlay { position: absolute; inset: 0; z-index: 20; background: rgba(5,6,8,.7); display: flex; flex-direction: column; justify-content: flex-end; animation: fade .16s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { background: var(--plate); border-radius: 14px 14px 0 0; max-height: 92%; overflow-y: auto; padding: 16px var(--gutter-r) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); display: flex; flex-direction: column; gap: 14px; animation: rise .3s cubic-bezier(.22,.8,.24,1); }
@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
.sheet input, .sheet textarea, .sheet select { background: var(--ground); }
.sheet .chip { background: var(--plate-2); }
.sheet .chip.on { background: var(--accent); }
.sheet .dayrow { background: var(--plate-2); }
.sheet h2 { font-size: 30px; }
.shead { display: flex; align-items: center; gap: 8px; }
.shead h2 { flex: 1; min-width: 0; }
.mins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.minbtn { aspect-ratio: 1; width: 100%; max-width: 72px; margin: 0 auto; border-radius: 50%; background: var(--ground); box-shadow: inset 0 0 0 5px var(--c); font-family: var(--stamp); font-weight: 800; font-size: 28px; display: grid; place-items: center; }
.minbtn.on { background: var(--c); color: var(--t); }
.dial { position: relative; width: min(72vw, 300px, 40vh); aspect-ratio: 1; margin: 0 auto; }
.dial svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
.dial .read { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.dial .read b { font-family: var(--stamp); font-weight: 900; font-size: min(21vw, 88px, 12vh); font-variant-numeric: tabular-nums; line-height: 1; }

function summaryView() {

    return { name: sets[0].name, sets, pr: prior.length && topNow > best, diff };
  });
  const prs = items.filter(x => x.pr).length;
  return `<div class="pad stack narrow" style="padding-block:28px 24px;gap:16px">

function allExercises() {

function chartSVG(data, goal) {

  try {
    const res = await Promise.race([puter.ai.chat(messages, { max_tokens: maxTokens, temperature: .5 }), limit]);
    const text = readAIText(res).trim();

let exIndex = null, exIndexLoading = false;
function loadExIndex() {
  if (exIndex || exIndexLoading || window.claude) return;
  exIndexLoading = true;
  fetch('data/exercise-index.json').then(r => r.json()).then(d => {
    const FILL = new Set(['with', 'on', 'the', 'a', 'an', 'to', 'of', 'and', 'exercise', 'version']);
    const toks = n => n.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').map(w => w.length > 3 ? w.replace(/s$/, '') : w).filter(w => w && !FILL.has(w));
    exIndex = d.map(([id, name]) => ({ id, toks: new Set(toks(name)), n: toks(name).length }));
    exIndex.toks = toks;
    if (S.sheet && S.sheet.type === 'exinfo') renderSheet();
  }).catch(() => {}).finally(() => { exIndexLoading = false; });
}
function photoIdFor(name, en) {
  const known = PHOTO_BY_NAME[String(name || '').toLowerCase()];
  if (known) return known;
  const enKey = String(en || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  if (PHOTO_BY_EN[enKey]) return PHOTO_BY_EN[enKey];
  if (!en || !exIndex) return null;
  const q = exIndex.toks(en); if (!q.length) return null;
  let best = null, bestScore = 0;
  for (const c of exIndex) {
    if ([...c.toks].some(w => PHOTO_MODS.has(w) && !q.includes(w))) continue;
    const hit = q.filter(w => c.toks.has(w)).length, score = hit / (q.length + c.n - hit), all = hit === q.length;
    const s2 = all ? score + .35 : score;
    if (s2 > bestScore) { bestScore = s2; best = c; }
  }
  return bestScore >= .62 ? best.id : null;
}

async function gymSearch(text) {
  const a = S.ai.gym, log = []; a.busy = true; a.err = ''; a.detail = ''; a.results = null; a.note = 'Buscando gimnasios…'; render();
  let gyms = null;

    const isGym = r => (r.category === 'leisure' && /fitness|sports_centre/.test(r.type)) || (r.category === 'amenity' && r.type === 'gym') || (r.extratags && r.extratags.leisure === 'fitness_centre');
    gyms = res.filter(isGym).map(r => ({ name: r.name || r.display_name.split(',')[0], address: r.display_name.split(',').slice(1, 4).join(',').trim(), lat: +r.lat, lon: +r.lon, hours: (r.extratags && r.extratags.opening_hours) || '', source: 'osm', osm: r.osm_type + '/' + r.osm_id }));

/* ========== progression suggestion ========== */
function parseRepRange(reps) {
  const m = String(reps || '').match(/(\d+)\s*(?:-|–|a)\s*(\d+)/);
  if (m) return [+m[1], +m[2]];
  const one = String(reps || '').trim().match(/^(\d+)$/);
  return one ? [+one[1], +one[1]] : null;
}
/* Double progression: add reps inside the range, then add weight. Two weak sessions in a row: step back a little. */
function suggestNext(exId, excludeId) {
  const hist = historyFor(exId, excludeId), last = hist[0];
  if (!last) return null;
  const info = exInfo(exId), step = S.data.settings.step;
  const top = Math.max(...last.sets.map(x => x.w));
  const work = last.sets.filter(x => x.w === top), first = work[0].r, minR = Math.min(...work.map(x => x.r));
  if (top <= 0) return { w: 0, r: first + 1, why: 'Sin peso: intenta hacer una repetición más.' };

/* ========== consistency ========== */
function consistency() {
  const planned = Math.max(1, days().filter(d => d.weekday != null).length);
  const trained = new Set(finished().map(s => startOfDay(s.start)));
  const WEEK = 7 * 864e5, addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.setHours(0, 0, 0, 0); };
  const thisWeek = startOfWeek(Date.now());
  const countIn = w => { let n = 0; for (let i = 0; i < 7; i++) if (trained.has(addDays(w, i))) n++; return n; };
  const now = countIn(thisWeek);
  let streak = 0, w = addDays(thisWeek, -7);
  while (countIn(w) >= planned) { streak++; w = addDays(w, -7); }
  if (now >= planned) streak++;

  if (trained.size) {
    const firstWeek = startOfWeek(Math.min(...trained));
    for (let x = firstWeek; x <= thisWeek; x = addDays(x, 7)) { if (countIn(x) >= planned) { run++; best = Math.max(best, run); } else if (x !== thisWeek) run = 0; }
  }
  return { planned, now, streak, best: Math.max(best, streak), trained, thisWeek, addDays, WEEK };
}

}

  let cells = '';

    cells += `<i class="cal ${on ? 'on' : ''} ${t === today ? 'now' : ''} ${fut ? 'fut' : ''}" style="grid-column:${w + 1};grid-row:${d + 1}" title="${fmtDate(t)}${on ? ': entrenado' : ''}"></i>`;
  }

}

function fanfare() {
  if (!audio || audio.state !== 'running') return;
  try {
    const t0 = audio.currentTime + .02;
    [523, 659, 784, 1047].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'triangle'; o.frequency.value = f;

      o.connect(g).connect(audio.destination); o.start(at); o.stop(at + len + .02);

  } catch (e) {}
}

const PULL_AT = 70;
let pull = null;
const ptr = document.createElement('div'); ptr.className = 'ptr'; ptr.hidden = true; app.appendChild(ptr);
function pullReset(animated) {
  const sc = screenEl(), hero = $('.hero, .auth-hero', sc);
  if (hero) { hero.style.transition = animated ? 'height .2s ease' : ''; hero.style.height = ''; }
  sc.style.transition = animated ? 'transform .2s ease' : ''; sc.style.transform = '';

screenEl().addEventListener('touchstart', ev => {
  pull = null;

  if (ev.target.closest('[data-step], [data-grip], #chart-svg, input, textarea, select')) return;
  const hero = $('.hero, .auth-hero', screenEl());
  pull = { y: ev.touches[0].clientY, d: 0, hero, h: hero ? hero.offsetHeight : 0 };
  if (hero) hero.style.transition = '';

}, { passive: true });
screenEl().addEventListener('touchmove', ev => {
  if (!pull) return;
  if (drag || (swipe && swipe.locked)) { pull = null; pullReset(false); return; }
  const dy = ev.touches[0].clientY - pull.y;
  if (dy <= 0 || screenEl().scrollTop > 0) { pull.d = 0; pullReset(false); if (screenEl().scrollTop > 0) pull = null; return; }
  if (dy < 26) { if (pull.d) { pull.d = 0; pullReset(false); } return; }
  pull.d = Math.min(130, (dy - 26) * .5);
  if (pull.hero) pull.hero.style.height = pull.h + pull.d + 'px';
  else screenEl().style.transform = 'translateY(' + pull.d + 'px)';
  if (pull.d > 12) { ptr.hidden = false; ptr.textContent = pull.d >= PULL_AT ? 'Suelta para recargar' : 'Tira para recargar'; }
}, { passive: true });
